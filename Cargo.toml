[workspace]
members = ["crates/moonitor-core", "crates/moonitor-agent", "crates/moonitor-store", "crates/moonitor-desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
moonitor-core = { path = "crates/moonitor-core" }
moonitor-agent = { path = "crates/moonitor-agent" }
moonitor-store = { path = "crates/moonitor-store" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
