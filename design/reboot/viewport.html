<!doctype html><html lang="it"><meta charset="utf-8"><title>Moonitor / fixed viewport design review</title><style>html,body{margin:0;background:#363a48}iframe{display:block;border:0;outline:2px solid #f36}</style><iframe title="Studio Moonitor a dimensione fissa"></iframe><script>const q=new URLSearchParams(location.search);const f=document.querySelector('iframe');f.width=q.get('w')||1440;f.height=q.get('h')||900;q.delete('w');q.delete('h');f.src='index.html?'+q;const o=document.createElement("output");o.style="display:block;color:white;font:14px monospace";o.textContent=`Viewport ${f.width}×${f.height}; browser ${innerWidth}; dpr ${devicePixelRatio}; rect ${f.getBoundingClientRect().width}`;document.body.append(o);window.addEventListener('message',e=>{if(e.origin!==location.origin||e.data.type!=='moonitor-design-layout')return;let l=document.getElementById('layout-report');if(!l){l=document.createElement('output');l.id='layout-report';l.style='display:block;color:white;font:14px monospace';document.body.append(l);}l.textContent='LAYOUT QA '+JSON.stringify(e.data);});</script></html>
